version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npx prisma db push --skip-generate
        - npx prisma generate
    build:
      commands:
        # Amplify exposes branch variables to the build only; the SSR compute
        # reads them from .env.production at runtime.
        - env | grep -E '^(DATABASE_URL|APP_)' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
